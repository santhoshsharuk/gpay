<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to GPay...</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #333;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Redirecting to GPay...</h2>
    <p>Please wait or <a id="manualLink" href="#">click here</a> if not redirected.</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get("amount") || "0";
    const upiID = "santhoshsharuk16-1@okhdfcbank";
    const name = "Santhosh Sharuk";
    const note = "Payment via GPay";

    const upiLink = `upi://pay?pa=${upiID}&pn=${encodeURIComponent(name)}&tn=${encodeURIComponent(note)}&am=${amount}&cu=INR`;
    document.getElementById("manualLink").href = upiLink;

    // Auto-redirect after 1 second
    setTimeout(() => {
      window.location.href = upiLink;
    }, 1000);
  </script>
</body>
</html>
